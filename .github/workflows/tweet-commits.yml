name: Daily Commit Summary Tweet

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Get commits
        id: commits
        run: |
          COMMITS=$(git log --since="24 hours ago" --no-merges --pretty=format:"• %s")
          if [ -z "$COMMITS" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            HEADER="Today's updates:"
            FULL_TEXT=$(printf "%s\n\n%s" "$HEADER" "$COMMITS")
            TRIMMED_TEXT=$(python3 -c 'import sys; text = sys.stdin.read().strip(); print(text if len(text) <= 280 else text[:277] + "...")' <<< "$FULL_TEXT")
            {
              echo 'tweet<<EOF'
              echo "$TRIMMED_TEXT"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Tweet commits
        if: steps.commits.outputs.has_commits == 'true'
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWEET_TEXT: ${{ steps.commits.outputs.tweet }}
        run: |
          pip install requests requests-oauthlib
          python3 - << 'EOF'
          import os, sys, requests
          from requests_oauthlib import OAuth1

          auth = OAuth1(
              os.environ["TWITTER_API_KEY"],
              os.environ["TWITTER_API_SECRET"],
              os.environ["TWITTER_ACCESS_TOKEN"],
              os.environ["TWITTER_ACCESS_TOKEN_SECRET"]
          )

          response = requests.post(
              "https://api.x.com/2/tweets",
              auth=auth,
              json={"text": os.environ["TWEET_TEXT"]}
          )

          print("Status:", response.status_code)
          print("Response:", response.text)
          if response.status_code not in (200, 201):
              sys.exit(1)
          EOF
