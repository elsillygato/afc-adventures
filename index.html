<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="default.css">
        <title>ASC Adventures: HEAD-ON</title>
        <script src="scripts/navbar.js" defer></script>
        <script src="scripts/musicstuff.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <nav id="navbar">
            <ul>
                <li class="selected"><img src="ascadventures3cropped.png"></li>
                <li><a href="about.html">About ASC Adventures</a></li>
                <li><a href="crew.html">Meet the Crew</a></li>
            </ul>
        </nav>
        <main>
            <div class="intro">
                <h1>Welcome!</h1>
            </div>
            <div id="countdowncontainer">
                <h2>Countdown to ASC2026</h2>
                <div id="countdown">
                    <p id="days" class="cdnumbers">D</p>
                    <p id="hours" class="cdnumbers">H</p>
                    <p id="minutes" class="cdnumbers">M</p>
                    <p id="seconds" class="cdnumbers">S</p>
                    <p class="cdlabels">Days</p>
                    <p class="cdlabels">Hours</p>
                    <p class="cdlabels">Minutes</p>
                    <p class="cdlabels">Seconds</p>
                </div>
            </div>
            <article>
                <h2>Welcome to ASC Adventures!</h2>
                <p>Currently, this website is under construction. Please check back soon for updates!</p>
            </article>
        </main>
        <script>
                    // Set the date we're counting down to
                    var countDownDate = new Date("Sep 19, 2026 10:00:00").getTime();

                    // Update the count down every 1 second
                    var x = setInterval(function() {

                    // Get today's date and time
                    var now = new Date().getTime();

                    // Find the distance between now and the count down date
                    var distance = countDownDate - now;

                    // Time calculations for days, hours, minutes and seconds
                    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    // Display the result in the element with id="timer"
                    document.getElementById("days").innerHTML = days;
                    document.getElementById("hours").innerHTML = hours;
                    document.getElementById("minutes").innerHTML = minutes;
                    document.getElementById("seconds").innerHTML = seconds;

                    // If the count down is finished, write some text
                    if (distance < 0) {
                        clearInterval(x);
                        document.getElementById("days").innerHTML = "TIME'S";
                        document.getElementById("hours").innerHTML = "";
                        document.getElementById("minutes").innerHTML = "";
                        document.getElementById("seconds").innerHTML = "UP";
                    }
                    }, 1000);
        </script>
    </body>
</html>
